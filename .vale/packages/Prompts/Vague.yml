# A word that names no action. "Handle errors" and "ensure quality" read as
# instructions and instruct nothing; a model given them does whatever it was
# going to do. Each needs the sentence rewritten around what should happen.
#
# "relevant" and "correctly" are not here. In the wild they point at a thing
# the sentence already names -- "the relevant dependencies", "spelled
# correctly" -- and flagging them was noise, two alerts in three.
extends: existence
message: "'%s' says nothing about what to do. Say what."
link: https://code.claude.com/docs/en/best-practices
level: warning
ignorecase: true
tokens:
  - handle
  - handles
  - ensure
  - ensures
  - deal with
  - take care of
  - address
  - manage
  - appropriate
  - appropriately
  - properly
  - as needed
  - as necessary
  - if necessary
  - if needed
  - when appropriate
  - where applicable
  - where possible
  - best practices
  - gracefully
  - robust
