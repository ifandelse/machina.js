# A description says what the skill does and when to use it; the model picks
# a skill from the description alone. The skill guide's form is "Use when
# working with PDF files or when the user mentions PDFs". A description with
# no trigger phrase is half a description.
extends: existence
message: "The description says what the skill does but not when to use it. Add 'Use when ...'."
link: https://platform.claude.com/docs/en/agents-and-tools/agent-skills/best-practices#writing-effective-descriptions
level: warning
scope: raw
nonword: true
tokens:
  - '(?mi)^description:(?!.*\b(?:use (?:this (?:skill )?|it )?(?:when(?:ever)?|for|if|to)|when(?:ever)? (?:the user|a user|claude|the model|the assistant|the agent|asked|working|you|someone)|trigger|invoke|for (?:tasks|requests|questions))\b)'
