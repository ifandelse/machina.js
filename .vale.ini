# Vale prose linter. https://docs.vale.sh
#
# Third-party packages are downloaded by `vale sync` into StylesPath and are
# gitignored; only our own vocabulary under StylesPath/config is committed.
# Packages are pinned to a release URL so every machine and CI run gets the
# same rules. To upgrade, bump the URL and re-run `vale sync`.
#
# JustSaySo is the banned-word list from ifandelse/just-say-so. The just-say-so
# Claude Code plugin resolves this .vale.ini instead of its shipped fallback,
# so the style must be loaded here or the banned list stops applying in-session.
#
# Prompts (jdkato/prompts) publishes no release, so its rule files are vendored
# under .vale/packages/Prompts (tracked in git) from commit 0fb3361da35a,
# 2026-09-04, MIT. `vale sync` copies that directory into StylesPath like any
# other package. Requires Vale >= 3.21.0.

StylesPath = .vale/styles
MinAlertLevel = suggestion

Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells-commits.zip, \
  https://github.com/Syntaf/vale-llm-slop/releases/download/v0.1.0/STE.zip, \
  https://github.com/ifandelse/just-say-so/releases/download/v0.3.0/JustSaySo.zip, \
  .vale/packages/Prompts

Vocab = Machina

# The Starlight docs site uses .mdx; Vale only lints formats it knows, so map
# it to Markdown. Component imports and JSX lines land in the calibration
# notes if they produce noise.
[formats]
mdx = md
COMMIT_EDITMSG = md

# Prose rules for Markdown. ai-tells is the baseline. STE (Simplified Technical
# English) runs at suggestion so the baseline stays legible in the output.
# Policy: ai-tells runs at its shipped levels, and all of its prose rules ship
# at error. Under just-say-so block mode each one blocks the turn on a line an
# agent adds. That is intended: error means the rule has no known
# false-positive class on this repo's prose. Downgrade a rule here
# (`ai-tells.Rule = warning`) when a sample run shows otherwise.
[*.{md,mdx}]
BasedOnStyles = ai-tells, STE, JustSaySo
STE = suggestion
STE.Dictionary = NO        # plain-language swap list, rewrites precise terms
STE.Gerunds = NO           # -ing forms are ordinary technical prose
STE.Ambiguity = NO         # treats "/" in every path and "e.g." as ambiguity
STE.ProcedureLength = NO   # caps list items at 20 words as if every bullet were a step
STE.Contractions = NO      # STE bans them; our writing rules do not
ai-tells.ColonUsage = NO   # flags the "**Label**: Sentence" list convention this repo uses on purpose
# Split by author (2026-10-05): a semicolon a human chose is valid prose, and
# the file tiers are where human writing meets the gate. Warning here;
# [*.chat.md] re-pins it to error, because chat and gh-published text pass
# through agents only.
ai-tells.SemicolonUsage = warning
# Domain-vocabulary collisions, from the 2026-10-03 calibration run over the 57
# tracked Markdown files. In an FSM library these verbs are the literal
# technical meaning, not figurative AI filler, so the rules are off:
ai-tells.FigurativeFires = NO    # events, hooks, and _onEnter "fire" — core event terminology
ai-tells.FigurativeStays = NO    # an FSM "stays" in a state; "stay put" is the documented handler semantic
ai-tells.FormalRegister = NO     # flags "implementation" and "prioritize"; both are precise terms here
# Mixed rules: each flagged real tells AND accepted technical idiom in the
# sample run ("survives a reload", "tests live alongside", "the deepest
# handler wins", "ships CJS + ESM", "surface as compile errors", "the payload
# carries", "the error names the state", a legit three-feature enumeration).
# Warning keeps them as edit-time advice without blocking the turn or a commit.
ai-tells.MortalityMetaphors = warning
ai-tells.FigurativeLives = warning
ai-tells.FigurativeWins = warning
ai-tells.ShipOveruse = warning
ai-tells.FigurativeSurfaces = warning
ai-tells.FigurativeCarries = warning
ai-tells.BareNames = warning
ai-tells.AnthropomorphicCognition = warning
ai-tells.VerbTricolon = warning

# Agent instruction files: AGENTS.md / CLAUDE.md / SKILL.md at any depth, plus
# everything under .claude/ (commands, agents) and .ai/ (test-generation and
# workflow instructions). Those two directories are gitignored, so only the
# in-session hooks ever lint them — pre-commit and CI never see them.
# Vale section semantics, verified on this repo: when a file matches more than
# one section, the later section's BasedOnStyles REPLACES the earlier list, so
# these sections repeat the [*.{md,mdx}] styles explicitly and add Prompts —
# while per-rule level keys (STE = suggestion, the NO toggles above) MERGE
# across matched sections and need no repeating. Two sections because Vale's
# glob parser rejects alternation nested inside an outer brace group; both
# carry the same policy. The {**/,} alternation lets the glob match the
# absolute paths that hooks and lint-staged pass.
[{**/,}{AGENTS,CLAUDE,SKILL}.md]
BasedOnStyles = ai-tells, STE, JustSaySo, Prompts
Prompts = warning          # advice tier; promote rules individually once a sample run clears them
# These two check hard limits with no false-positive class, so they block.
Prompts.Paths = error
Prompts.Frontmatter = error
STE.Modals = NO            # SHOULD / MAY are RFC 2119 keywords in instruction files

# Same policy as the section above. The second {**/,} covers any nesting depth
# under the directory (.claude/commands/x.md and .ai/x.md both match); Vale's
# ** refuses to cross a path separator when fused to a suffix like `**.md`.
[{**/,}{.claude,.ai}/{**/,}*.md]
BasedOnStyles = ai-tells, STE, JustSaySo, Prompts
Prompts = warning
Prompts.Paths = error
Prompts.Frontmatter = error
STE.Modals = NO

# Generated API reference (typedoc output rendered by Starlight). Nobody
# hand-writes this prose; linting it would only report the generator's
# phrasing. An empty style list disables every style for the match.
[{**/,}packages/docs/src/content/docs/api/**]
BasedOnStyles =

# Changelogs are assembled by changesets from PR summaries; the generator owns
# the phrasing. 59 of the calibration run's alerts came from one CHANGELOG.
[{**/,}CHANGELOG.md]
BasedOnStyles =

# Archived pipeline artifacts (old reports, briefs, build plans). They reach
# the archive by being moved there after the work ships; linting them would
# only report old prose nobody is rewriting.
[{**/,}docs/archive/**]
BasedOnStyles =

# Chat replies and published fragments lint under *.chat.md (just-say-so's
# convention). Lexical and sentence-level rules only — document-level rules
# (heading style, section length) stay out of text that has no document.
[*.chat.md]
BasedOnStyles = ai-tells, JustSaySo
# Chat-only calibration (2026-10-04): the figurative-verb family fired on
# conversational register in 7 of the first 10 gated replies, and each
# error-level block re-renders the whole reply in the terminal. The family
# runs as advice in chat. Files keep every rule at its [*.{md,mdx}] level,
# and the core bans (contrastive negation, semicolons, em-dashes, filler
# frames, buzzwords) still block chat.
# A *.chat.md name also matches [*.{md,mdx}], and the later section's value
# wins for a shared key. The file tier warns on semicolons for human prose;
# chat has no human author, so the error returns here.
ai-tells.SemicolonUsage = error
ai-tells.BareHolds = warning
ai-tells.BareNames = warning
ai-tells.BareReaches = warning
ai-tells.FigurativeBreeds = warning
ai-tells.FigurativeCarries = warning
ai-tells.FigurativeCasts = warning
ai-tells.FigurativeClears = warning
ai-tells.FigurativeDemands = warning
ai-tells.FigurativeDisguises = warning
ai-tells.FigurativeDraws = warning
ai-tells.FigurativeEarns = warning
ai-tells.FigurativeFalls = warning
ai-tells.FigurativeFires = warning
ai-tells.FigurativeHolds = warning
ai-tells.FigurativeIdioms = warning
ai-tells.FigurativeKeeps = warning
ai-tells.FigurativeLands = warning
ai-tells.FigurativeLends = warning
ai-tells.FigurativeLives = warning
ai-tells.FigurativeLoud = warning
ai-tells.FigurativeMints = warning
ai-tells.FigurativeNouns = warning
ai-tells.FigurativeOwns = warning
ai-tells.FigurativePays = warning
ai-tells.FigurativeQuantities = warning
ai-tells.FigurativeQuiet = warning
ai-tells.FigurativeReaches = warning
ai-tells.FigurativeRides = warning
ai-tells.FigurativeRuns = warning
ai-tells.FigurativeSees = warning
ai-tells.FigurativeSettles = warning
ai-tells.FigurativeShape = warning
ai-tells.FigurativeSits = warning
ai-tells.FigurativeStays = warning
ai-tells.FigurativeStrikes = warning
ai-tells.FigurativeSurfaces = warning
ai-tells.FigurativeSweeps = warning
ai-tells.FigurativeTravels = warning
ai-tells.FigurativeTrips = warning
ai-tells.FigurativeWins = warning
ai-tells.FigurativeWorth = warning
ai-tells.FusionMetaphors = warning
ai-tells.MortalityMetaphors = warning
ai-tells.MotionMetaphors = warning

# HTML artifacts and any other HTML prose. Vale parses HTML and skips tags,
# scripts, and styles. A .html file matches only this section, so the
# [*.{md,mdx}] toggles are repeated here: level keys merge only across
# sections whose globs both match the file. Coverage note: the in-session
# hooks lint HTML writes, while the pre-commit and CI gates cover Markdown
# extensions only (check-staged lints .md/.mdx/.markdown).
[*.html]
BasedOnStyles = ai-tells, STE, JustSaySo
ai-tells.SemicolonUsage = warning   # same author split as [*.{md,mdx}]
STE = suggestion
STE.Dictionary = NO
STE.Gerunds = NO
STE.Ambiguity = NO
STE.ProcedureLength = NO
STE.Contractions = NO
ai-tells.ColonUsage = NO
ai-tells.FigurativeFires = NO
ai-tells.FigurativeStays = NO
ai-tells.FormalRegister = NO
ai-tells.MortalityMetaphors = warning
ai-tells.FigurativeLives = warning
ai-tells.FigurativeWins = warning
ai-tells.ShipOveruse = warning
ai-tells.FigurativeSurfaces = warning
ai-tells.FigurativeCarries = warning
ai-tells.BareNames = warning
ai-tells.AnthropomorphicCognition = warning
ai-tells.VerbTricolon = warning

# Commit-message rules. A commit message matches only this section.
[{COMMIT_EDITMSG,.git/COMMIT_EDITMSG}]
BasedOnStyles = ai-tells, ai-tells-commits
